name: Build Raspberry Pi Image

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-pi-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract version from tag or VERSION file
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install CustomPiOS
        run: |
          pip3 install custompios || pip3 install git+https://github.com/guysoft/CustomPiOS.git
      
      - name: Build Raspberry Pi image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: roblockwood
          GITHUB_REPO: shatter-nc
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          # Create build directory
          mkdir -p build
          cd build
          
          # Copy pi-image directory
          cp -r ../pi-image .
          
          # Authenticate with GitHub Container Registry for pulling images
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Build CustomPiOS image
          # Note: CustomPiOS may require running in a specific environment
          # This is a simplified version - adjust based on CustomPiOS requirements
          custompios --config pi-image/config.yaml --output shatter-nc.img || {
            echo "CustomPiOS build failed. Using alternative method..."
            # Fallback: Use pi-gen or direct image customization
            # This would require additional setup
            exit 1
          }
      
      - name: Compress image
        run: |
          cd build
          xz -9 -k shatter-nc.img || zip -9 shatter-nc.zip shatter-nc.img
          ls -lh build/
      
      - name: Generate checksums
        run: |
          cd build
          sha256sum shatter-nc.img* > shatter-nc-checksums.txt
          cat shatter-nc-checksums.txt
      
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/shatter-nc.img.xz
            build/shatter-nc-checksums.txt
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Shatter CNC Platform Raspberry Pi Image
            
            Version: ${{ steps.version.outputs.version }}
            
            ### Installation
            
            1. Download and extract the image file
            2. Flash to SD card using Raspberry Pi Imager or similar tool
            3. Insert SD card into Raspberry Pi and boot
            4. Follow the first-boot setup wizard to configure WiFi and credentials
            5. Access the web interface at http://shatter.local
            
            ### Manual Installation
            
            For existing Raspberry Pi systems, use the installation script:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/roblockwood/shatter-nc/main/scripts/install-shatter.sh | bash
            ```
            
            See [PI_DEPLOYMENT.md](docs/PI_DEPLOYMENT.md) for detailed documentation.
          draft: false
          prerelease: false
      
      - name: Upload artifacts
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pi-image-${{ steps.version.outputs.version }}
          path: |
            build/shatter-nc.img*
            build/shatter-nc-checksums.txt
          retention-days: 30
