name: Bump Version on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump-version:
    if: |
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '#patch') ||
       contains(github.event.comment.body, '#minor') ||
       contains(github.event.comment.body, '#major'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get PR details
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              number: pr.data.number,
              state: pr.data.state,
              merged: pr.data.merged,
              author: pr.data.user.login,
              base_ref: pr.data.base.ref,
              head_ref: pr.data.head.ref
            };

      - name: Check PR is open and targeting main
        run: |
          if [ "${{ steps.pr.outputs.state }}" != "open" ]; then
            echo "❌ PR is not open. Current state: ${{ steps.pr.outputs.state }}"
            exit 1
          fi
          if [ "${{ steps.pr.outputs.base_ref }}" != "main" ]; then
            echo "❌ PR is not targeting main branch"
            exit 1
          fi
          echo "✅ PR is open and targeting main"

      - name: Verify comment author
        id: verify
        uses: actions/github-script@v8
        with:
          script: |
            const commentAuthor = context.payload.comment.user.login;
            const prAuthor = '${{ steps.pr.outputs.author }}';
            const isPrAuthor = commentAuthor === prAuthor;
            
            // Check if user has write access (maintainer/collaborator)
            let hasWriteAccess = false;
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commentAuthor
              });
              hasWriteAccess = permission.permission === 'write' || permission.permission === 'admin';
            } catch (error) {
              // User might not be a collaborator, that's okay
              console.log(`Could not check permissions for ${commentAuthor}`);
            }
            
            const isAuthorized = isPrAuthor || hasWriteAccess;
            
            if (!isAuthorized) {
              core.setFailed(`User ${commentAuthor} is not authorized to trigger version bump. Only PR author or repository maintainers can trigger.`);
            }
            
            return { authorized: isAuthorized };

      - name: Detect bump type
        id: bump_type
        run: |
          COMMENT="${{ github.event.comment.body }}"
          BUMP_TYPE=""
          
          if echo "$COMMENT" | grep -qi "#major"; then
            BUMP_TYPE="major"
          elif echo "$COMMENT" | grep -qi "#minor"; then
            BUMP_TYPE="minor"
          elif echo "$COMMENT" | grep -qi "#patch"; then
            BUMP_TYPE="patch"
          fi
          
          if [ -z "$BUMP_TYPE" ]; then
            echo "❌ No valid bump type found in comment"
            exit 1
          fi
          
          echo "type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "✅ Detected bump type: $BUMP_TYPE"

      - name: Read current version
        id: current_version
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.current }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
          
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEW_VERSION}"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          echo "Tag: $TAG"

      - name: Update VERSION file
        run: |
          echo "${{ steps.new_version.outputs.version }}" > VERSION

      - name: Update backend config
        run: |
          sed -i.bak "s/APP_VERSION: str = \".*\"/APP_VERSION: str = \"${{ steps.new_version.outputs.version }}\"/" backend/app/core/config.py
          rm backend/app/core/config.py.bak

      - name: Update frontend package.json
        run: |
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${{ steps.new_version.outputs.version }}\"/" frontend/package.json
          rm frontend/package.json.bak

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version bump commit
        run: |
          git add VERSION backend/app/core/config.py frontend/package.json
          git commit -m "Bump version to ${{ steps.new_version.outputs.version }} [skip ci]"

      - name: Push version bump commit to PR branch
        run: |
          PR_BRANCH="${{ steps.pr.outputs.head_ref }}"
          git push origin HEAD:$PR_BRANCH

      - name: Add comment to PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Version bump triggered!\n\n**Previous:** ${{ steps.current_version.outputs.current }}\n**New:** ${{ steps.new_version.outputs.version }}\n**Type:** ${{ steps.bump_type.outputs.type }}\n\n✅ Version files updated:\n- \`VERSION\`\n- \`backend/app/core/config.py\`\n- \`frontend/package.json\`\n\nAfter you merge this PR, tag \`${{ steps.new_version.outputs.tag }}\` will be created automatically, which will trigger:\n- Docker image builds`
            });
