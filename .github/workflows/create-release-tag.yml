name: Create Release Tag After Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version was bumped
        id: check_version
        run: |
          # Check if the merged PR contains version bump commit
          if git log --oneline -10 | grep -q "Bump version"; then
            echo "version_bumped=true" >> $GITHUB_OUTPUT
            echo "✅ Version bump detected in merged PR"
          else
            echo "version_bumped=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No version bump detected, skipping tag creation"
          fi

      - name: Read version and create tag
        if: steps.check_version.outputs.version_bumped == 'true'
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG already exists, skipping"
            exit 0
          fi
          
          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          
          echo "✅ Created and pushed tag: $TAG"

      - name: Comment on PR
        if: steps.check_version.outputs.version_bumped == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const VERSION = fs.readFileSync('VERSION', 'utf-8').trim();
            const TAG = `v${VERSION}`;
            
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Release tag \`${TAG}\` created successfully!\n\nThis will trigger:\n- 🐳 Docker image builds (via push to main)`
            });
