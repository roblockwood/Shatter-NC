name: Build Beta Docker Images

# Integration builds for the beta branch. Tags :beta and commit SHA only — never :latest or :vX.Y.Z.
# Stable releases are built from main in release.yml after semantic-release.

on:
  push:
    branches:
      - beta
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - 'VERSION'
      - '.github/workflows/docker-build-beta.yml'
      - '.github/workflows/release.yml'

jobs:
  build-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout beta
        uses: actions/checkout@v6

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building beta (VERSION file): $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date +%Y-%m-%d)
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_REPO_LOWER="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/${TARGET_REPO_LOWER}/backend" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/${TARGET_REPO_LOWER}/frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:beta
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.DATE_TAG }}-${{ steps.tags.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
            VITE_RELEASE_CHANNEL=beta
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:beta
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.DATE_TAG }}-${{ steps.tags.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make published packages public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GHCR_PUBLISH_TOKEN is not set; images were pushed but package visibility was not updated."
            exit 0
          fi
          owner="${{ github.repository_owner }}"
          repo_name="${{ github.event.repository.name }}"
          target_repo="$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')"
          want_backend="${target_repo}/backend"
          want_frontend="${target_repo}/frontend"

          pkgs_json="$(gh api --paginate "users/${owner}/packages?package_type=container&per_page=100")"
          echo "$pkgs_json" | jq -e 'type=="array"' >/dev/null

          backend_pkg="$(printf '%s' "$pkgs_json" | jq -r --arg want "$want_backend" '.[] | select(.name==$want) | .name' | head -n 1)"
          frontend_pkg="$(printf '%s' "$pkgs_json" | jq -r --arg want "$want_frontend" '.[] | select(.name==$want) | .name' | head -n 1)"

          urlenc () { jq -sRr @uri <<<"$1"; }

          set_public () {
            local pkg_name="$1"
            if [ -z "$pkg_name" ]; then
              return 1
            fi
            local pkg_enc
            pkg_enc="$(urlenc "$pkg_name")"
            gh api -X PUT "users/${owner}/packages/container/${pkg_enc}/visibility" -f visibility=public && return 0
            gh api -X PUT "user/packages/container/${pkg_enc}/visibility" -f visibility=public && return 0
            return 1
          }

          set_public "$backend_pkg" || echo "Warning: backend package visibility update failed (continuing)."
          set_public "$frontend_pkg" || echo "Warning: frontend package visibility update failed (continuing)."

      - name: Build summary
        run: |
          echo "## Beta Docker Images Built and Pushed 🐳" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Channel:** beta (integration — not a stable release)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** GitHub Container Registry (ghcr.io)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Git SHA:** ${{ steps.tags.outputs.SHORT_SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:beta\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:beta\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
