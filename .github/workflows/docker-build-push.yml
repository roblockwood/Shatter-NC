name: Validate Docker Builds

# Stable images are built in release.yml (main). Beta images in docker-build-beta.yml.
# This workflow only validates production Dockerfiles on pull requests.

on:
  pull_request:
    branches:
      - main
      - beta
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - 'VERSION'
      - '.github/workflows/docker-build-push.yml'
      - '.github/workflows/docker-build-beta.yml'
      - '.github/workflows/release.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Validating Docker build for VERSION: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Generate image names
        id: tags
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/${REPO_LOWER}/backend" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/${REPO_LOWER}/frontend" >> $GITHUB_OUTPUT

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: false
          tags: |
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: false
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:pr-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "## Docker Images Built Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** Pull request validation (images not pushed)" >> $GITHUB_STEP_SUMMARY
          echo "**Architectures:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend and frontend production images built successfully. Ready to merge!" >> $GITHUB_STEP_SUMMARY
