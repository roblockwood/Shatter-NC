name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --prefix frontend semantic-release

  # Runs after semantic-release so VERSION / package.json / config match the GitHub Release.
  # Checks out current main (includes chore(release) when semantic-release pushed).
  build-docker:
    needs: release
    # Skip path diff on repository-initial push (before is all zeros).
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide if Docker images need a rebuild
        id: filter
        run: |
          mapfile -t files < <(git diff --name-only "${{ github.event.before }}" HEAD)
          NEED=false
          for f in "${files[@]}"; do
            case "$f" in
              backend/*|frontend/*|database/*|docker-compose.prod.yml|VERSION|.github/workflows/docker-build-push.yml|.github/workflows/release.yml)
                NEED=true
                break ;;
            esac
          done
          echo "need_docker=$NEED" >> "$GITHUB_OUTPUT"
          echo "Docker rebuild needed: $NEED"
          if [ "$NEED" = true ]; then
            printf 'Changed files:\n'
            printf '%s\n' "${files[@]}"
          fi

      - name: Read version
        id: version
        if: steps.filter.outputs.need_docker == 'true'
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        if: steps.filter.outputs.need_docker == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.need_docker == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Cross-repo publishing (private source -> public package namespace) requires a PAT.
          # Create repo secret GHCR_PUBLISH_TOKEN with write:packages.
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        if: steps.filter.outputs.need_docker == 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date +%Y-%m-%d)
          OWNER="${{ github.repository_owner }}"
          # Publish to the public install repo namespace (not the private source repo name).
          TARGET_REPO_LOWER="shatter-nc-install"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/${TARGET_REPO_LOWER}/backend" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/${TARGET_REPO_LOWER}/frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        if: steps.filter.outputs.need_docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/roblockwood/shatter-nc-install
          tags: |
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:latest
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:v${{ steps.version.outputs.version }}
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.DATE_TAG }}-${{ steps.tags.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: steps.filter.outputs.need_docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/roblockwood/shatter-nc-install
          tags: |
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:latest
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:v${{ steps.version.outputs.version }}
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.DATE_TAG }}-${{ steps.tags.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make published packages public
        if: steps.filter.outputs.need_docker == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GHCR_PUBLISH_TOKEN is not set; skipping visibility update."
            exit 0
          fi
          # For user-owned packages, prefer the explicit username endpoint.
          # Package names for GHCR are nested like "shatter-nc-install/backend" (URL-encoded).
          pkg_backend="shatter-nc-install%2Fbackend"
          pkg_frontend="shatter-nc-install%2Ffrontend"

          set_public () {
            local pkg="$1"
            gh api -X PUT "users/${{ github.repository_owner }}/packages/container/${pkg}/visibility" -f visibility=public && return 0
            gh api -X PUT "user/packages/container/${pkg}/visibility" -f visibility=public && return 0
            return 1
          }

          if ! set_public "$pkg_backend"; then
            echo "Warning: failed to set backend package visibility to public (continuing)."
          fi
          if ! set_public "$pkg_frontend"; then
            echo "Warning: failed to set frontend package visibility to public (continuing)."
          fi

      - name: Build summary
        if: steps.filter.outputs.need_docker == 'true'
        run: |
          echo "## Docker Images Built and Pushed to GitHub Packages 🐳" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** GitHub Container Registry (ghcr.io)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Git SHA:** ${{ steps.tags.outputs.SHORT_SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architectures:** linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:v${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:v${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
