name: Release

# Stable channel: release-please opens a version PR on main; when that PR merges,
# it creates the GitHub Release + tag, then we build :latest / :vX.Y.Z images.
# Integration builds for day-to-day work use the beta branch (docker-build-beta.yml).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Only publish stable images when release-please actually cut a release (tag).
  build-docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (tag ${{ needs.release-please.outputs.tag_name }})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date +%Y-%m-%d)
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          TARGET_REPO_LOWER="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "DATE_TAG=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/${TARGET_REPO_LOWER}/backend" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/${TARGET_REPO_LOWER}/frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:latest
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:v${{ steps.version.outputs.version }}
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}
            ${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.DATE_TAG }}-${{ steps.tags.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:latest
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:v${{ steps.version.outputs.version }}
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}
            ${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.DATE_TAG }}-${{ steps.tags.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make published packages public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GHCR_PUBLISH_TOKEN is not set; images were pushed but package visibility was not updated."
            exit 0
          fi
          owner="${{ github.repository_owner }}"
          repo_name="${{ github.event.repository.name }}"
          target_repo="$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')"
          want_backend="${target_repo}/backend"
          want_frontend="${target_repo}/frontend"

          pkgs_json="$(gh api --paginate "users/${owner}/packages?package_type=container&per_page=100")"
          echo "$pkgs_json" | jq -e 'type=="array"' >/dev/null

          backend_pkg="$(printf '%s' "$pkgs_json" | jq -r --arg want "$want_backend" '.[] | select(.name==$want) | .name' | head -n 1)"
          frontend_pkg="$(printf '%s' "$pkgs_json" | jq -r --arg want "$want_frontend" '.[] | select(.name==$want) | .name' | head -n 1)"

          echo "Discovered backend package: ${backend_pkg:-<none>}"
          echo "Discovered frontend package: ${frontend_pkg:-<none>}"

          urlenc () { jq -sRr @uri <<<"$1"; }

          set_public () {
            local pkg_name="$1"
            if [ -z "$pkg_name" ]; then
              return 1
            fi
            local pkg_enc
            pkg_enc="$(urlenc "$pkg_name")"
            gh api -X PUT "users/${owner}/packages/container/${pkg_enc}/visibility" -f visibility=public && return 0
            gh api -X PUT "user/packages/container/${pkg_enc}/visibility" -f visibility=public && return 0
            return 1
          }

          if ! set_public "$backend_pkg"; then
            echo "Warning: backend package not found or visibility update failed (continuing)."
          fi
          if ! set_public "$frontend_pkg"; then
            echo "Warning: frontend package not found or visibility update failed (continuing)."
          fi

      - name: Build summary
        run: |
          echo "## Stable Docker Images Built and Pushed to GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Channel:** stable (main — moves :latest and semver tags)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** GitHub Container Registry (ghcr.io)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release tag:** ${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Git SHA:** ${{ steps.tags.outputs.SHORT_SHA }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architectures:** linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Backend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:v${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.BACKEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:v${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.FRONTEND_IMAGE }}:${{ steps.tags.outputs.SHORT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
