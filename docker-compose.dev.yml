services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shatter_user} -d ${POSTGRES_DB:-shatter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API service
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: development  # Use development target for hot-reload
    container_name: shatter-backend
    restart: unless-stopped
    env_file:
      - .env
    init: true
    stop_grace_period: 20s
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS: ${COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS:-1}
      COMPRESSOR_STATUS_SAMPLES_RAW_DAYS: ${COMPRESSOR_STATUS_SAMPLES_RAW_DAYS:-14}
      # MQTT broker is optional; enable by starting the mosquitto service.
      MQTT_PUBLISH_HOST: ${MQTT_PUBLISH_HOST:-}
      MQTT_PUBLISH_PORT: ${MQTT_PUBLISH_PORT:-1883}
      MQTT_PUBLISH_USERNAME: ${MQTT_PUBLISH_USERNAME:-}
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-}
      # Optional Telnet proxy for CNC Protocol Type 2 (port 10000)
      # Useful on macOS Docker Desktop when containers cannot reach CNC telnet directly.
      SHATTER_TELNET_PROXY_HOST: ${SHATTER_TELNET_PROXY_HOST:-}
      SHATTER_TELNET_PROXY_PORT: ${SHATTER_TELNET_PROXY_PORT:-10000}
      MIGRATIONS_DIR: /docker-entrypoint-initdb.d
      FTP_SYNC_LOCAL_BROWSE_ROOT: /hostfs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app  # Mount backend code for hot-reload in development
      # Overlay migrations so run_migrations.py uses /app/migrations (bind mount hides image COPY)
      - ./database/init:/app/migrations:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./docker/generated:/docker/generated
      - ${FTP_SYNC_LOCAL_BROWSE_HOST_PATH:-/Users}:/hostfs:rw

  # Frontend web application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: shatter-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: /bin/sh -c "if [ ! -x /app/node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host"

  # Optional MQTT broker for telemetry fanout (CNC + compressors).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: shatter-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: shatter-network
