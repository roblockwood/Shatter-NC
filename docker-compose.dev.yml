# Development Docker Compose - uses standard PostgreSQL (smaller image)
services:
  # PostgreSQL (standard, smaller image for faster startup)
  postgres:
    image: postgres:15-alpine
    container_name: shatter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shatter_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: shatter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: shatter-network
