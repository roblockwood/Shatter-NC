services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shatter_user} -d ${POSTGRES_DB:-shatter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API service
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: development  # Use development target for hot-reload
    container_name: shatter-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app  # Mount backend code for hot-reload in development
      - ./database/init:/docker-entrypoint-initdb.d:ro

  # Frontend web application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: shatter-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: shatter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Avahi mDNS service discovery
  # Enables zero-configuration network discovery at http://shatter.local:3000
  # Note: network_mode: host is required for mDNS multicast to work
  avahi:
    build:
      context: ./avahi
      dockerfile: Dockerfile
    container_name: shatter-avahi
    network_mode: host  # Required for mDNS multicast
    volumes:
      - ./avahi/shatter-dev.service:/etc/avahi/services/shatter.service:ro
    restart: unless-stopped
    # Optional: Set custom hostname via environment variable
    # environment:
    #   - AVAHI_HOSTNAME=shatter

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: shatter-network
