version: '3.8'

# Production docker-compose with Watchtower labels for automatic updates
# This version includes labels that tell Watchtower to monitor these containers
#
# Usage:
#   1. Start Watchtower: docker compose -f docker-compose.watchtower.yml up -d
#   2. Start services: docker compose -f docker-compose.prod-auto.yml up -d
#
# Watchtower will automatically update backend and frontend when new images are pushed to GitHub Packages
#
# Note: You may need to authenticate with GitHub Packages first:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shatter_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network
    # Don't auto-update database (too risky)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Backend API service - with Watchtower label for auto-updates
  backend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-Shatter-NC}/backend:${IMAGE_TAG:-latest}
    container_name: shatter-backend-prod
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shatter-network
    # Enable Watchtower to auto-update this container
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Frontend web application - with Watchtower label for auto-updates
  frontend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-Shatter-NC}/frontend:${IMAGE_TAG:-latest}
    container_name: shatter-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shatter-network
    # Enable Watchtower to auto-update this container
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: shatter-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network
    # Don't auto-update Redis (stable version)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  shatter-network:
    driver: bridge

