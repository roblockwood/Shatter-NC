version: '3.8'

# Production docker-compose building images locally from source
# This file builds images from source code instead of pulling pre-built images
#
# Usage:
#   1. Create .env file with required variables (POSTGRES_PASSWORD, SECRET_KEY, etc.)
#   2. Build and start: docker compose -f docker-compose.prod.yml up -d --build
#   3. To rebuild after changes: docker compose -f docker-compose.prod.yml up -d --build
#
# Note: This file includes Watchtower service and labels for automatic updates.
# Watchtower will monitor and update containers when new images are built.
# For pre-built images from GitHub Packages, use docker-compose.prod-auto.yml instead.

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shatter_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network
    # Don't auto-update database (too risky)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Backend API service - with Watchtower label for auto-updates
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    container_name: shatter-backend-prod
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      SECRET_KEY: ${SECRET_KEY}
      # CORS_ORIGINS: Set to '["*"]' for production with dynamic IPs
      # Example: CORS_ORIGINS='["*"]' in .env file
      # Migration directory - defaults to /app/migrations (baked into image)
      # Can override with MIGRATIONS_DIR env var or volume mount if needed
      # MIGRATIONS_DIR: /docker-entrypoint-initdb.d
    # volumes:
      # Optional: Mount migration files to override baked-in migrations
      # If not mounted, migrations from /app/migrations (in image) will be used
      # - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shatter-network
    # Enable Watchtower to auto-update this container
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Frontend web application - with Watchtower label for auto-updates
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: shatter-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shatter-network
    # Enable Watchtower to auto-update this container
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: shatter-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network
    # Don't auto-update Redis (stable version)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Watchtower - Automatic container updates
  # Monitors containers with watchtower.enable=true label and updates them automatically
  # Using nickfedor/watchtower fork which supports Docker API 1.44+ (required for Docker Engine v29+)
  # Original containrrr/watchtower is no longer maintained and incompatible with newer Docker versions
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Check for updates every 5 minutes
      - WATCHTOWER_POLL_INTERVAL=300
      # Only watch containers with com.centurylinklabs.watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
      # Clean up old images after updating
      - WATCHTOWER_CLEANUP=true
      # Include stopped containers in cleanup
      - WATCHTOWER_REMOVE_STOPPED_CONTAINERS=true
      # Send notifications (optional - uncomment to enable)
      # - WATCHTOWER_NOTIFICATIONS=email
      # - WATCHTOWER_NOTIFICATION_EMAIL_FROM=your-email@example.com
      # - WATCHTOWER_NOTIFICATION_EMAIL_TO=your-email@example.com
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=smtp.gmail.com
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
    # Uncomment to run on a schedule instead of polling
    # command: --schedule "0 2 * * *"  # Run at 2 AM daily
    # Don't auto-update Watchtower itself (would cause issues)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  shatter-network:
    driver: bridge
