
# Production docker-compose pulling pre-built images from GitHub Packages
# This file pulls pre-built images instead of building locally
#
# Usage:
#   1. Authenticate: echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#   2. Start services: docker compose -f docker-compose.prod.yml up -d
#   3. To update: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db-prod
    restart: always
    environment:
      POSTGRES_DB: shatter
      POSTGRES_USER: shatter_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shatter_user -d shatter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: shatter-mqtt-prod
    restart: always
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_PORT:-1883}:1883"
    networks:
      - shatter-network

  kaeser-sc2-api:
    profiles: ["kaeser"]
    build:
      context: ./vendor/kaeser-sc2-api
      target: production
    container_name: shatter-kaeser-sc2-api-prod
    restart: always
    ports:
      - "${KAESER_SC2_API_PORT:-3004}:3004"
    env_file:
      - path: ./docker/kaeser-sc2-api.env
        required: false
      - path: ./docker/generated/compressor-1.env
        required: false
    depends_on:
      - mqtt
    networks:
      - shatter-network

  # Backend API service
  backend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/backend:${IMAGE_TAG:-latest}
    container_name: shatter-backend-prod
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shatter
      POSTGRES_USER: shatter_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASS:-}
      COMPRESSOR_REST_REFRESH_SECONDS: ${COMPRESSOR_REST_REFRESH_SECONDS:-10}
      COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS: ${COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS:-1}
      COMPRESSOR_STATUS_SAMPLES_RAW_DAYS: ${COMPRESSOR_STATUS_SAMPLES_RAW_DAYS:-14}
      KAESER_SIDECAR_ENV_DIR: ${KAESER_SIDECAR_ENV_DIR:-/docker/generated}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["*"]'
      # Migration directory - defaults to /app/migrations (baked into image)
      # Can override with MIGRATIONS_DIR env var or volume mount if needed
      # MIGRATIONS_DIR: /docker-entrypoint-initdb.d
    volumes:
      - ./docker/generated:/docker/generated
      # Optional: - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--max-time", "10", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - shatter-network

  # Frontend web application
  frontend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/frontend:${IMAGE_TAG:-latest}
    container_name: shatter-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shatter-network

volumes:
  postgres_data:
    driver: local

networks:
  shatter-network:
    driver: bridge
