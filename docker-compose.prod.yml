
# Production docker-compose — pre-built images from GitHub Container Registry (ghcr.io).
# No source checkout required: download this file + .env.production.example (see docs/INSTALLATION_GUIDE.md).
#
# Usage:
#   cp .env.production.example .env   # edit secrets first
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   # Optional MQTT broker: docker compose -f docker-compose.prod.yml --profile mqtt up -d

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db-prod
    restart: always
    environment:
      POSTGRES_DB: shatter
      POSTGRES_USER: shatter_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema is applied by backend migrations on startup (SQL is baked into the backend image).
    # Database is reachable only on the internal Docker network (not exposed on the host).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shatter_user -d shatter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network

  # Backend API service
  backend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/backend:${IMAGE_TAG:-latest}
    container_name: shatter-backend-prod
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shatter
      POSTGRES_USER: shatter_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS: ${COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS:-1}
      COMPRESSOR_STATUS_SAMPLES_RAW_DAYS: ${COMPRESSOR_STATUS_SAMPLES_RAW_DAYS:-14}
      SECRET_KEY: ${SECRET_KEY}
      # Set shop-specific browser origins, e.g. '["http://192.168.1.50","http://localhost"]'
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:3000","http://localhost"]'}
      # Optional MQTT publishing (leave MQTT_PUBLISH_HOST empty to disable).
      MQTT_PUBLISH_HOST: ${MQTT_PUBLISH_HOST:-}
      MQTT_PUBLISH_PORT: ${MQTT_PUBLISH_PORT:-1883}
      MQTT_PUBLISH_USERNAME: ${MQTT_PUBLISH_USERNAME:-}
      MQTT_PUBLISH_PASSWORD: ${MQTT_PUBLISH_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      LOCAL_TIMEZONE: ${LOCAL_TIMEZONE:-America/Los_Angeles}
      FTP_SYNC_ENABLED: ${FTP_SYNC_ENABLED:-true}
      MIGRATIONS_DIR: /app/migrations
      FTP_SYNC_LOCAL_BROWSE_ROOT: /hostfs
    volumes:
      - generated_data:/docker/generated
      - ${FTP_SYNC_LOCAL_BROWSE_HOST_PATH:-/Users}:/hostfs:rw
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--max-time", "10", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - shatter-network

  # Frontend web application
  frontend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/frontend:${IMAGE_TAG:-latest}
    container_name: shatter-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shatter-network

  # Optional MQTT broker for telemetry fanout (CNC + compressors).
  mosquitto:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2
    container_name: shatter-mosquitto-prod
    restart: always
    command: >
      /bin/sh -c "printf 'listener 1883\nallow_anonymous true\n' > /tmp/mosquitto.conf
      && exec mosquitto -c /tmp/mosquitto.conf"
    # Internal-only; enable with --profile mqtt when MQTT_PUBLISH_HOST=mosquitto
    networks:
      - shatter-network

volumes:
  postgres_data:
    driver: local
  generated_data:
    driver: local

networks:
  shatter-network:
    driver: bridge
