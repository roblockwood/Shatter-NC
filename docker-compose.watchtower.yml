version: '3.8'

# Watchtower - Automatic container updates
# This service watches all containers and updates them when new images are available
#
# Usage:
#   1. Authenticate with GitHub Packages (required for private packages):
#      echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
#   2. Start Watchtower:
#      docker compose -f docker-compose.watchtower.yml up -d
#   3. Start services with auto-update labels:
#      docker compose -f docker-compose.prod-auto.yml up -d
#
# Watchtower will automatically:
# - Check for new images every 5 minutes (configurable)
# - Pull new images when available
# - Restart containers with new images
# - Clean up old images
#
# Note: Watchtower uses the same Docker credentials as the host system.
# If you've logged in to ghcr.io, Watchtower will use those credentials.

services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker config to use host's authentication (if it exists)
      # Watchtower will use the same credentials as the Docker daemon
    environment:
      # Check for updates every 5 minutes
      - WATCHTOWER_POLL_INTERVAL=300
      # Only watch containers with com.centurylinklabs.watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
      # Clean up old images after updating
      - WATCHTOWER_CLEANUP=true
      # Include stopped containers in cleanup
      - WATCHTOWER_REMOVE_STOPPED_CONTAINERS=true
      # Send notifications (optional - uncomment to enable)
      # - WATCHTOWER_NOTIFICATIONS=email
      # - WATCHTOWER_NOTIFICATION_EMAIL_FROM=your-email@example.com
      # - WATCHTOWER_NOTIFICATION_EMAIL_TO=your-email@example.com
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=smtp.gmail.com
      # - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
    # Uncomment to run on a schedule instead of polling
    # command: --schedule "0 2 * * *"  # Run at 2 AM daily

