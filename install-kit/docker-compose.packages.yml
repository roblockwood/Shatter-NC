services:
  # Packages-only production compose:
  # - no bind mounts that require a source checkout
  # - backend image contains migrations and applies them on startup
  kaeser-sc2-api:
    profiles: ["kaeser"]
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc-install}/kaeser-sc2-api:${IMAGE_TAG:-latest}
    container_name: shatter-kaeser-sc2-api-prod
    restart: unless-stopped
    environment:
      KAESER_ADDRESS: ${KAESER_ADDRESS:-}
      KAESER_USERNAME: ${KAESER_USERNAME:-}
      KAESER_PASSWORD: ${KAESER_PASSWORD:-}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      MQTT_TOPIC_ROOT: ${MQTT_TOPIC_ROOT:-kaeser-sc2-01}
      LOG_LEVEL: ${KAESER_LOG_LEVEL:-info}
    ports:
      - "${KAESER_SC2_API_PORT:-3004}:3004"
    depends_on:
      - mqtt
    networks:
      - shatter-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: shatter-mqtt-prod
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    networks:
      - shatter-network

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: shatter
      POSTGRES_USER: shatter_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shatter_user -d shatter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network

  backend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc-install}/backend:${IMAGE_TAG:-latest}
    container_name: shatter-backend-prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shatter
      POSTGRES_USER: shatter_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASS:-}
      COMPRESSOR_REST_REFRESH_SECONDS: ${COMPRESSOR_REST_REFRESH_SECONDS:-10}
      COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS: ${COMPRESSOR_STATUS_SAMPLE_MIN_INTERVAL_SECONDS:-1}
      COMPRESSOR_STATUS_SAMPLES_RAW_DAYS: ${COMPRESSOR_STATUS_SAMPLES_RAW_DAYS:-14}
      KAESER_SIDECAR_ENV_DIR: ${KAESER_SIDECAR_ENV_DIR:-/docker/generated}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["*"]'
    volumes:
      - generated_data:/docker/generated
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--max-time", "10", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - shatter-network

  frontend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc-install}/frontend:${IMAGE_TAG:-latest}
    container_name: shatter-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shatter-network

volumes:
  postgres_data:
    driver: local
  generated_data:
    driver: local

networks:
  shatter-network:
    driver: bridge
