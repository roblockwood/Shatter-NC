# Production docker-compose for Raspberry Pi image
# This file is copied to /opt/shatter/ during image build

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: shatter-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Database migrations are baked into the backend image at /app/migrations
      # No need to mount database/init directory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shatter_user} -d ${POSTGRES_DB:-shatter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network

  # Backend API service
  backend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/backend:${IMAGE_TAG:-latest}
    container_name: shatter-backend-prod
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shatter}
      POSTGRES_USER: ${POSTGRES_USER:-shatter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-5}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["*"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--max-time", "10", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - shatter-network

  # Frontend web application
  frontend:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/frontend:${IMAGE_TAG:-latest}
    container_name: shatter-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shatter-network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: shatter-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shatter-network

  # Avahi mDNS service discovery
  # Enables zero-configuration network discovery at http://shatter.local
  # Note: network_mode: host is required for mDNS multicast to work
  avahi:
    image: ghcr.io/${GITHUB_OWNER:-roblockwood}/${GITHUB_REPO:-shatter-nc}/avahi:${IMAGE_TAG:-latest}
    container_name: shatter-avahi-prod
    network_mode: host  # Required for mDNS multicast
    tmpfs:
      - /run
    volumes:
      - ./avahi/shatter.service:/etc/avahi/services/shatter.service:ro
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  shatter-network:
    driver: bridge
